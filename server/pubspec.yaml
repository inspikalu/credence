name: credence_server
description: Credence server. Serves the web app, keeps vault metadata in SQLite and checks wallet-paid Walrus uploads on Sui.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.6
  http: ^1.2.0
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  sqlite3: ^2.9.4
  sui_auth:
    path: ../packages/sui_auth
  walrus_blob_check:
    path: ../packages/walrus_blob_check

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

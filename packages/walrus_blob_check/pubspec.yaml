name: walrus_blob_check
description: >-
  Server-side checks for Walrus blobs people stored with their own wallet:
  the Blob object is a certified Walrus blob owned by the expected address.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

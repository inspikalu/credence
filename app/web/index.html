<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credence · Certificate vault</title>
  <meta name="description" content="Store certificates and documents, and share a link anyone can open to check a copy. Files are stored on Walrus and checked in the browser.">
  <meta name="theme-color" content="#0F4D3A">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Credence">
  <meta property="og:title" content="Credence · Certificate vault">
  <meta property="og:description" content="Store certificates and documents, and share a link anyone can open to check a copy. Files are stored on Walrus and checked in the browser.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Credence: a certificate vault with share links anyone can check">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Credence · Certificate vault">
  <meta name="twitter:description" content="Store certificates and documents, and share a link anyone can open to check a copy.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Credence">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F3F5F2; }
    #credence-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F3F5F2; color: #0E1A16;
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      border-top: 4px solid #0F4D3A; box-sizing: border-box;
      transition: opacity 180ms ease-out;
    }
    #credence-loading img { width: 56px; height: 56px; }
    #credence-loading .name { font: 600 22px/1 Georgia, "Times New Roman", serif; letter-spacing: 0.01em; }
    #credence-loading .bar { width: 160px; height: 2px; background: #CDD6D1; overflow: hidden; }
    #credence-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #0F4D3A;
      animation: credence-slide 1.1s ease-in-out infinite;
    }
    #credence-loading .hint { color: #4A5852; font-size: 13px; }
    @keyframes credence-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #credence-loading .bar::after { animation: none; width: 100%; } }
    #credence-loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="credence-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="56" height="56" alt="">
    <div class="name">Credence</div>
    <div class="bar"></div>
    <div class="hint">Opening the vault…</div>
    <noscript><p>Credence needs JavaScript to check documents in your browser.</p></noscript>
  </div>
  <!-- The Wallet Standard bridge, loaded as a file so the page's
       Content-Security-Policy needs no inline scripts. -->
  <script src="assets/packages/sui_wallet_web/js/sui_wallet_standard.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
